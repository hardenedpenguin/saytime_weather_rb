# Syntax checks, unit tests, and package lint on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.7 = Debian 11 (minimum supported), 3.1 = Debian 12, 3.3 = Debian 13
        ruby: ['2.7', '3.1', '3.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Syntax checks
        run: make test

      - name: Unit tests
        run: make test-unit

  package:
    name: Build and lint .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper ruby devscripts lintian

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --fail-on error ../saytime-weather-rb_*_all.deb
